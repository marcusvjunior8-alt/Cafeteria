<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Opinião</title>
    <link rel="stylesheet" href="./style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
    <script src="./script.js" defer></script>
</head>

<body>
    <header>
        <div class="logo">
            <img src="./imgs/logo.png" alt="Logo Cafeteria">
        </div>
        <nav>
            <ul>
                <li><a href="./index.html">Home</a></li>
                <li><a href="./menu.html">Menu</a></li>
                <li><a href="./opiniao.html">Opinião</a></li>
                <li><a href="./lojas.html">Lojas</a></li>
            </ul>
        </nav>
    </header>
    <section class="feedback-section">
        <h2>DEIXE SEU FEEDBACK</h2>

        <form id="meu-formulario" action="#" method="POST">
            <div class="form-group">
                <label for="nome">Nome:</label>
                <input type="text" id="nome" name="nome" required>
            </div>

            <div class="form-group">
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" required>
            </div>

            <div class="form-group">
                <label>Avaliação:</label>
                <label>
                    <input type="radio" name="avaliacao" value="bom"> Bom
                </label>
                <label>
                    <input type="radio" name="avaliacao" value="excelente"> Excelente
                </label>
            </div>

            <div class="form-group">
                <label for="mensagem">Mensagem:</label>
                <textarea id="mensagem" name="mensagem" rows="4" required></textarea>
            </div>

            <button type="submit">ENVIAR AVALIAÇÃO</button>
        </form>
    </section>
    <footer>
        <div class="footer-container">
            <div class="footer-coluna">
                <h3>Navegação</h3>
                <ul>
                    <li><a href="./index.html">Home</a></li>
                    <li><a href="menu.html">Menu</a></li>
                    <li><a href="opiniao.html">Opinião</a></li>
                    <li><a href="./lojas.html">Lojas</a></li>
                </ul>
            </div>
            <div class="footer-coluna">
                <h3>Redes Sociais</h3>
                <div class="redes-sociais">
                    <a href="#" aria-label="Instagram"><i class="fab fa-instagram"></i></a>
                    <a href="#" aria-label="Facebook"><i class="fab fa-facebook-f"></i></a>
                    <a href="#" aria-label="YouTube"><i class="fab fa-youtube"></i></a>
                </div>
            </div>
        </div>
        <div class="footer-bottom">
            <p>&copy; 2026 Cafeteria Aroma. Todos os direitos reservados.</p>
        </div>
    </footer>
</body>

</html>
